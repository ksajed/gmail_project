
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Visualisation ordonnance</title>

    <style>
        :root {
            --bg: #f1f5f9;
            --panel: #ffffff;
            --primary: #2563eb;
            --danger: #dc2626;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= HEADER ================= */

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 55%;
        }

        .subtitle {
            font-size: 12px;
            color: var(--muted);
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        /* ================= ACTIONS ================= */

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #f9fafb;
            color: var(--text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        .btn:hover {
            filter: brightness(0.95);
        }

        /* ================= VIEWER ================= */

        .viewer-container {
            flex: 1;
            padding: 12px;
            background: var(--bg);
        }

        .viewer {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            height: 100%;
        }

        object, iframe, img {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* ================= FOOTER ================= */

        footer {
            background: var(--panel);
            border-top: 1px solid var(--border);
            padding: 8px 16px;
            font-size: 11px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
        }

        @media print {
            header, footer {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header>
    <div class="header-left">
        <div class="title">📄 {{ attachment.original_filename }}</div>
        <div class="subtitle">Visualisation sécurisée — lecture seule</div>
    </div>

    <div class="actions">
        <a class="btn" href="{% url 'core_attachments:download_attachment' attachment.id %}">
            ⬇️ Télécharger
        </a>

        <button class="btn" onclick="window.print()">
            🖨️ Imprimer
        </button>

        <button class="btn btn-danger" onclick="closeViewer()">
            ✖ Fermer
        </button>
    </div>
</header>

<!-- ================= VIEWER ================= -->
<div class="viewer-container">
    <div class="viewer">
        <object data="{{ stream_url }}" type="application/pdf">
            <p style="padding:16px">
                Prévisualisation non disponible.<br>
                <a href="{% url 'core_attachments:download_attachment' attachment.id %}">
                    Télécharger le fichier
                </a>
            </p>
        </object>
    </div>
</div>

<!-- ================= FOOTER ================= -->
<footer>
    <span>Accès sécurisé — Traçabilité active</span>
    <span>Application Ordo</span>
</footer>

<script>
function closeViewer() {
    if (window.opener) {
        window.close();
    } else {
        window.history.back();
    }
}
</script>

</body>
</html>
