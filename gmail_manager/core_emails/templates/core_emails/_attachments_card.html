<section class="card full">
        <div class="card__header">
          <h3 class="card__title">
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M21 15V8a2 2 0 00-2-2H8l-2 2H5a2 2 0 00-2 2v7a2 2 0 002 2h14a2 2 0 002-2z"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            Pièces jointes
          </h3>
          <span class="chip">{{ attachments|length }} fichier(s)</span>
        </div>

        <div class="card__body">
          <ul class="filelist">
            {% for a in attachments %}
              <li class="file">
                <div class="file__meta">
                  <p class="file__name" title="{{ a.original_filename }}">{{ a.original_filename }}</p>
                  <p class="file__sub">ID : {{ a.id }}</p>
                </div>
                <div class="file__actions">
                  <a class="btn btn--sm" href="{% url 'core_attachments:download_attachment' a.id %}">
                    Télécharger
                  </a>
                  <a class="btn btn--sm btn-viewer" href="#"
                     data-viewer-url="{% url 'core_attachments:attachment_viewer' a.id %}">
                    Visionner
                  </a>
                </div>
              </li>
            {% empty %}
              <li class="v muted">Aucune pièce jointe.</li>
            {% endfor %}
          </ul>
        </div>
      </section>
