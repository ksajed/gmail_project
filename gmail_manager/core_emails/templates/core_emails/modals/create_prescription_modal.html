<div class="modal-overlay" id="createPrescriptionModal">
  <div class="modal-card">

    <div class="modal-header">
      <h2>Nouvelle ordonnance</h2>
      <button type="button"
              class="modal-close"
              data-close="createPrescriptionModal">✕</button>
    </div>

    <div class="modal-body">
      <form method="post" action="{% url 'core_emails:prescription_create' %}">
        {% csrf_token %}

        <label>Origine de l’ordonnance</label>
        <select name="sender_type" required>
          <option value="patient">Patient</option>
          <option value="nurse">Infirmier</option>
          <option value="doctor">Médecin</option>
        </select>

        <label>Email patient (optionnel)</label>
        <input type="email" name="email" placeholder="patient@email.fr">

        <div class="modal-actions">
          <button type="button"
                  class="btn"
                  data-close="createPrescriptionModal">
            Annuler
          </button>
          <button type="submit"
                  class="btn btn--primary">
            Créer
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
