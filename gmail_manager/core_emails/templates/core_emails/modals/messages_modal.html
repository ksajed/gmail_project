{# core_emails/modals/messages_modal.html #}
{# Popup unique (closable) pour messages Django. Compatible avec static/js/dashboard_msg_modal.js #}

<div id="dashMsgModal"
     class="modal-overlay"
     role="dialog"
     aria-modal="true"
     aria-labelledby="dashMsgModalTitle"
     style="display:none;"
     data-show="1">
  <div class="modal" role="document">
    <div class="modal__header">
      <h2 id="dashMsgModalTitle">Notifications</h2>
      <button id="dashMsgCloseBtn" class="iconbtn" type="button" aria-label="Fermer">×</button>
    </div>

    <div class="modal__body">
      {% if messages %}
        <ul style="margin:0; padding-left:18px;">
          {% for message in messages %}
            <li data-msg-item="1">
              {{ message }}
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <div class="hint">Aucune notification.</div>
      {% endif %}
    </div>
  </div>
</div>
