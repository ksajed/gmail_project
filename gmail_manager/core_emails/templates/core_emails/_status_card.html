<section class="card">
        <div class="card__header">
          <h3 class="card__title">
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            Statut
          </h3>
          <span class="chip">Action</span>
        </div>

        <div class="card__body">
          <form method="post" action="{% url 'core_emails:change_status' prescription.id %}">
            {% csrf_token %}
            <div class="field">
              <label>Changer le statut</label>
              <select name="status" required>
                <option value="">Sélectionner</option>
                {% for value, label in allowed_statuses %}
                  <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
              </select>
              <div class="hint">Le changement de statut peut déclencher des notifications.</div>
            </div>

            <div class="btnrow" style="justify-content:flex-start;">
              <button type="submit" class="btn btn--primary">Valider</button>
              <a class="btn" href="{% url 'core_emails:dashboard' %}">Retour dashboard</a>
            </div>
          </form>
        </div>
      </section>
