{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — Ordo</title>

    <style>
        :root {
            --primary: #1f9d55;
            --primary-dark: #157347;
            --text: #0f172a;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f4f6f8;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(1200px 600px at 50% -200px, #e9f7ef 0%, transparent 60%),
                linear-gradient(180deg, #f9fafb 0%, #eef2f7 100%);
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        /* =============================
           CONTAINER
        ============================= */
        .login-box {
            width: 440px;
            padding: 46px 48px 50px;
            background: var(--card);
            border-radius: 18px;
            box-shadow:
                0 30px 60px rgba(0,0,0,0.10),
                0 2px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        /* =============================
           LOGO
        ============================= */
        .logo {
            max-width: 300px;
            width: 100%;
            height: auto;
            margin: 0 auto 34px;
            display: block;
        }

        /* =============================
           TITRE
        ============================= */
        .login-box h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 30px;
            color: var(--text);
        }

        /* =============================
           FORM
        ============================= */
        .login-box form p {
            margin-bottom: 22px;
            text-align: left;
        }

        .login-box label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(31,157,85,0.15);
        }

        /* =============================
           BUTTON
        ============================= */
        .login-box button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: linear-gradient(
                180deg,
                var(--primary) 0%,
                var(--primary-dark) 100%
            );
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow:
                0 12px 26px rgba(31,157,85,0.35),
                inset 0 1px 0 rgba(255,255,255,0.2);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .login-box button:hover {
            transform: translateY(-1px);
            box-shadow:
                0 18px 36px rgba(31,157,85,0.45),
                inset 0 1px 0 rgba(255,255,255,0.25);
        }

        .login-box button:active {
            transform: translateY(0);
        }

        /* =============================
           FOOTER
        ============================= */
        .footer {
            margin-top: 38px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.2px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <!-- LOGO -->
    <img
        src="{% static 'admin/img/ordo.png' %}"
        alt="Logo Ordo"
        class="logo"
    >

    <h1>Connexion sécurisée</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Se connecter</button>
    </form>

    <div class="footer">
        © Ordo — Pharmacie de Fives
    </div>

</div>

</body>
</html>
