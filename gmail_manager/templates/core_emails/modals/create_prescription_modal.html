<div class="modal-overlay" id="createPrescriptionModal" aria-hidden="true" style="display:none">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="createPrescriptionTitle">

    <div class="modal-header">
      <div class="modal-titlewrap">
        <div class="modal-badge" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M8 3h8a2 2 0 012 2v16H6V5a2 2 0 012-2z" stroke="currentColor" stroke-width="2"/>
            <path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h2 id="createPrescriptionTitle">Nouvelle ordonnance</h2>
          <p class="modal-subtitle">Ajout manuel rapide • PDF ou image</p>
        </div>
      </div>

      <button type="button" class="modal-close" id="modalCloseBtn" aria-label="Fermer">✕</button>
    </div>

    <div class="modal-body">
      <form method="post" action="{% url 'core_emails:prescription_create' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-grid">
          <div>
            <label for="senderType">Origine</label>
            <select class="select" id="senderType" name="sender_type" required>
              <option value="patient">Patient</option>
              <option value="nurse">Infirmier</option>
              <option value="doctor">Médecin</option>
            </select>
          </div>

          <div>
            <label for="patientEmail">Email patient <span aria-hidden="true">*</span></label>
            <input
              class="input"
              id="patientEmail"
              type="email"
              name="email"
              placeholder="patient@email.fr"
              autocomplete="email"
              inputmode="email"
              required
            >
            <div class="help">Champ obligatoire : sans email, l’ordonnance ne sera pas créée.</div>
          </div>
        </div>

        <!-- ✅ DRAG & DROP + CLICK -->
        <div class="dropzone" id="rxDropzone" tabindex="0" role="button" aria-label="Ajouter une ordonnance">
          <!-- input réel (caché visuellement par CSS, PAS display:none) -->
          <input
            id="attachments"
            class="dropzone-input"
            type="file"
            name="attachments"
            multiple
            accept=".pdf,image/*"
            required
          >

          <div class="dropzone-ui">
            <div class="dropzone-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 16V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M7 9l5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 20h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>

            <div class="dropzone-text">
              <div class="dropzone-title">Fichier ordonnance</div>
              <div class="dropzone-hint" id="rxDropHint">
                Glissez-déposez ici (PDF / image) ou cliquez sur “Choisir”.
              </div>
            </div>

            <button type="button" class="dropzone-btn" id="rxPickBtn">Choisir</button>
          </div>

          <div class="dropzone-meta" id="rxFilesMeta">Aucun fichier sélectionné.</div>
        </div>

        <div class="modal-footer">
          <button type="button" id="modalCancelBtn" class="btn">Annuler</button>
          <button type="submit" class="btn btn--primary">Créer</button>
        </div>
      </form>
    </div>

  </div>
</div>
